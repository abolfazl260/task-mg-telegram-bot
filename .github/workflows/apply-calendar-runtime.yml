name: Apply calendar runtime adapters

on:
  push:
    paths:
      - 'scripts/apply_calendar_runtime.py'
      - 'services/calendar_runtime.py'
      - 'services/date_service.py'
      - 'main.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply calendar runtime adapters') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply runtime adapters
        run: python scripts/apply_calendar_runtime.py

      - name: Commit patched handlers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "chore: apply calendar runtime adapters"
          git push
