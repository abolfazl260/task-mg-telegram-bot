name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTING: "true"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run test suite
        run: python -m pytest -q

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff bandit
      - name: Ruff new-violation gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          def run_ruff(root):
              result = subprocess.run(
                  ["ruff", "check", ".", "--output-format", "json"],
                  cwd=root,
                  capture_output=True,
                  text=True,
              )
              if result.returncode not in (0, 1):
                  sys.stderr.write(result.stderr)
                  raise SystemExit(result.returncode)
              return json.loads(result.stdout or "[]")

          def diagnostic_key(item, root):
              path = Path(item["filename"])
              if not path.is_absolute():
                  path = Path(root) / path
              try:
                  relative = path.resolve().relative_to(Path(root).resolve()).as_posix()
              except ValueError:
                  relative = path.as_posix()
              return relative, item.get("code") or "", item.get("message") or ""

          base_sha = (os.environ.get("BASE_SHA") or "").strip()
          if not base_sha or set(base_sha) == {"0"}:
              fallback = subprocess.run(
                  ["git", "rev-parse", "HEAD^"],
                  capture_output=True,
                  text=True,
              )
              base_sha = fallback.stdout.strip() if fallback.returncode == 0 else ""

          head_root = Path.cwd()
          head = run_ruff(head_root)

          if not base_sha:
              print("No baseline commit is available; enforcing Ruff on the current tree.")
              base = []
          else:
              with tempfile.TemporaryDirectory(prefix="ruff-base-") as tmp:
                  subprocess.run(
                      ["git", "worktree", "add", "--detach", tmp, base_sha],
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
                  try:
                      base = run_ruff(tmp)
                      base_root = Path(tmp)
                      base_counts = Counter(diagnostic_key(item, base_root) for item in base)
                  finally:
                      subprocess.run(
                          ["git", "worktree", "remove", "--force", tmp],
                          check=True,
                          stdout=subprocess.DEVNULL,
                      )

          if not base_sha:
              base_counts = Counter()

          head_counts = Counter(diagnostic_key(item, head_root) for item in head)
          new_counts = head_counts - base_counts

          if not new_counts:
              print(
                  f"Ruff gate passed: no new violations "
                  f"(baseline={sum(base_counts.values())}, current={sum(head_counts.values())})."
              )
              raise SystemExit(0)

          remaining = new_counts.copy()
          for item in head:
              key = diagnostic_key(item, head_root)
              if remaining[key] <= 0:
                  continue
              location = item.get("location") or {}
              row = location.get("row", 1)
              column = location.get("column", 1)
              filename, code, message = key
              print(f"{filename}:{row}:{column}: {code} {message}")
              remaining[key] -= 1

          print(f"Ruff gate failed: {sum(new_counts.values())} new violation(s).")
          raise SystemExit(1)
          PY
      - name: Bandit security scan
        run: bandit -r . -x .git,tests,.venv,venv --severity-level medium

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  core-flow-regression:
    name: Core bot flow regression tests
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test core Telegram flows
        run: python -m pytest -q tests/test_core_flows.py
