name: Cleanup merged branches once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-merged-branches-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "business-operations-complete"
            "fix/complete-native-async-migration"
            "test/issue-91-team-role-authorization"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
