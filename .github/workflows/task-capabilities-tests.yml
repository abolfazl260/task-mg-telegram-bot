name: Task Capability Tests

on:
  push:
    branches:
      - feat/habit-task-options
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run task capability regression tests
        run: python -m pytest -q tests/test_task_capabilities.py tests/test_tag_flow_routing.py
