<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>افزودن وظیفه</title><link rel="stylesheet" href="/static/app.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main class="app"><header class="header"><div><p class="eyebrow">مدیریت وظایف</p><h1>وظیفه جدید</h1></div><button id="back" class="icon-button" type="button">←</button></header><form id="task-form" class="task"><label>عنوان<input id="title" required maxlength="500"></label><label>توضیحات<textarea id="description" rows="5"></textarea></label><label>اولویت<select id="priority"><option value="low">پایین</option><option value="medium" selected>متوسط</option><option value="high">بالا</option></select></label><label>مهلت<input id="deadline" type="datetime-local"></label><label>دسته‌بندی<input id="category"></label><label>تگ‌ها<input id="tags" placeholder="با ویرگول جدا کنید"></label><button class="submit-button" type="submit">ایجاد وظیفه</button><p id="state" class="state" hidden></p></form></main><script src="/static/add.js"></script></body></html>
