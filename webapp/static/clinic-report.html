<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش کلینیک</title><style>body{font-family: sans-serif;background:#f6f7f9;color:#182230;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:18px;margin:14px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar button{padding:10px;border:1px solid #d8dee8;border-radius:9px;font:inherit}.patient{border-top:1px solid #edf0f5;padding:14px 0}.patient h3{margin:0 0 8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#eef2ff;padding:4px 8px;border-radius:999px;font-size:12px}</style></head><body><main class="wrap"><h1>🏥 گزارش کلینیک</h1><p>بیماران، پرونده بالینی و جلسه‌های زمان‌دار</p><section class="card toolbar"><input id="org" placeholder="شناسه سازمان" required><input id="branch" placeholder="شناسه شعبه (اختیاری)"><button id="load">بارگذاری گزارش</button></section><section id="summary" class="card"></section><section id="patients" class="card">برای نمایش گزارش، شناسه سازمان را وارد کنید.</section></main><script src="https://telegram.org/js/telegram-web-app.js"></script><script>(function(){const tg=window.Telegram?.WebApp;tg?.ready();const q=new URLSearchParams(location.search),token=q.get('bot_key')||'clinic',h={'Content-Type':'application/json',...(tg?.initData?{'X-Telegram-Init-Data':tg.initData}:{})};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));load.onclick=async()=>{const oid=org.value.trim();if(!oid)return;const b=branch.value.trim();const r=await fetch(`/api/clinic/report?bot_key=${encodeURIComponent(token)}&organization_id=${encodeURIComponent(oid)}${b?'&branch_id='+encodeURIComponent(b):''}`,{headers:h});const d=await r.json();if(!r.ok){patients.textContent='دریافت گزارش ناموفق بود.';return}summary.innerHTML=`<b>${d.total_patients}</b> بیمار · <b>${d.total_sessions}</b> جلسه`;patients.innerHTML=d.patients.map(x=>{const p=x.patient,c=x.clinical_record||{};return `<article class="patient"><h3>${esc(p.display_name)}</h3><div class="chips"><span class="chip">جلسه‌ها: ${x.sessions.length}</span>${c.diagnoses?`<span class="chip">تشخیص: ${esc(c.diagnoses)}</span>`:''}</div><p>${c.clinical_notes?esc(c.clinical_notes):'پرونده بالینی هنوز ثبت نشده است.'}</p><details><summary>جزئیات پرونده</summary><p>حساسیت‌ها: ${esc(c.allergies)||'—'}<br>بیماری‌های زمینه‌ای: ${esc(c.chronic_conditions)||'—'}<br>داروها: ${esc(c.medications)||'—'}</p></details><h4>جلسه‌ها</h4><ul>${x.sessions.map(s=>`<li>${esc(s.title)} · ${esc(s.expected_at||'بدون زمان')} · ${esc(s.status)}</li>`).join('')||'<li>جلسه‌ای ثبت نشده</li>'}</ul></article>`}).join('')||'بیماری ثبت نشده است.'};})();</script></body></html>
