<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>جزئیات وظیفه</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">جزئیات</p>
        <h1 id="task-title">در حال دریافت...</h1>
      </div>
      <div class="header-actions">
        <a id="dashboard-link" class="header-link" href="#">📊 گزارش تحت وب</a>
        <button id="back" class="icon-button" type="button" aria-label="بازگشت">←</button>
      </div>
    </header>
    <section id="state" class="state">در حال دریافت وظیفه...</section>
    <article id="task" class="task" hidden></article>
    <form id="edit-form" class="task" hidden>
      <label>عنوان<input id="edit-title" required maxlength="500"></label>
      <label>توضیحات<textarea id="edit-description" rows="5"></textarea></label>
      <label>وضعیت<select id="edit-status"><option value="pending">در انتظار</option><option value="in_progress">در حال انجام</option><option value="done">انجام شده</option><option value="cancelled">لغو شده</option></select></label>
      <label>اولویت<select id="edit-priority"><option value="low">پایین</option><option value="medium">متوسط</option><option value="high">بالا</option></select></label>
      <label>مهلت<input id="edit-deadline" type="datetime-local"></label>
      <label>دسته‌بندی<input id="edit-category"></label>
      <label>تگ‌ها<input id="edit-tags"></label>
      <button class="submit-button" type="submit">ذخیره تغییرات</button>
    </form>
    <button id="edit" class="submit-button" type="button" hidden>ویرایش وظیفه</button>
  </main>
  <script src="/static/task.js"></script>
  <script>
    (function() {
      const b = document.getElementById('dashboard-link');
      const pathToken = (location.pathname.startsWith('/tasks/') || location.pathname.startsWith('/task/')) ? location.pathname.split('/')[2] : '';
      const t = window.__dashboardTaskToken || pathToken || new URLSearchParams(location.search).get('bot_key') || '';
      if (t && b) {
        b.href = '/' + encodeURIComponent(t);
        b.hidden = false;
        b.textContent = '📊 گزارش تحت وب';
      } else if (b) {
        b.hidden = true;
      }
    })();
  </script>
</body>
</html>
